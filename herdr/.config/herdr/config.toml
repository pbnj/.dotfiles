# herdr server reload-config
onboarding = false

[theme]
name = "tokyo-night-day"
auto_switch = true

[keys]
next_tab = ["prefix+n", "ctrl+alt+]"]
goto = ["prefix+ctrl+w"]
cycle_pane_next = "prefix+ctrl+o"
split_vertical = "prefix+backslash"
next_agent = "alt+]"
previous_agent = "alt+["
focus_agent = "alt+1..9"
next_workspace = ["prefix+ctrl+n"]
previous_workspace = ["prefix+ctrl+p"]
# prefix+1..9 goes to workspaces, not tabs; tabs stay on prefix+n / prefix+p.
switch_workspace = "prefix+1..9"
switch_tab = ""
# Closest thing to tmux's prefix+l: jumps to the last focused pane, across
# workspaces and tabs. prefix+l itself is focus_pane_right.
last_pane = "prefix+tab"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "cd ~/.dotfiles && pi --model glean"
description = "Pi with Glean"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "nvim -c Projects"
description = "Projects"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = "fzf-herdr-project"
description = "Fuzzy-find or clone projects"
width = "80%"
height = "80%"

[ui]
show_agent_labels_on_pane_borders = false

# A single-tab workspace has nothing to switch between, so the row is only
# chrome. It comes back the moment a second tab exists.
hide_tab_bar_when_single_tab = true

# One block per agent, fed by ~/.local/bin/herdr-agent-status. A row disappears
# when none of its tokens has a value, so an absent fact costs no line.
#
# herdr separates the tokens within a row with a middle dot, and the rows here
# are assembled from their parts rather than pre-joined by the producer, so one
# separator punctuates the whole sidebar: "opus-5 · medium", "dotfiles · main",
# "u5h · 8 · 2h55m". The dim tokens are chrome -- the label that says which
# number this is, the branch, the reset countdown -- and the undimmed one is
# the fact.
#
# The token-count rows are the one place a row holds more than one label/value
# pair, so they need a second separator between the pairs that herdr does not
# supply. They arrive from the producer already joined -- "i · 163 | o · 71.8k"
# -- with the same dot binding label to value and a pipe between the groups.
#
# The percentages carry no "%": value rules only compare against values that
# parse completely as finite numbers, so the unit has to go for the number to
# redden as it climbs. Rules are ordered and the first match wins, so the
# thresholds run high to low. `fg` is a literal hex and does not follow
# theme.auto_switch, so these are mid-tones that hold up on both themes.
#
# The per-agent overrides omit the `agent` built-in because $model already names
# what is running, more precisely than the agent label does.
agent_panel_sort = "priority"
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  [{ token = "$model", bold = true }, { token = "$effort", dim = true }],
  ["$repo", { token = "$branch", dim = true }],
  [
    { token = "$ctxl", dim = true },
    { token = "$ctx", rules = [
      { gt = 90, fg = "#db4b4b", bold = true },
      { gt = 75, fg = "#c07617" },
    ] },
  ],
  [
    { token = "$u5hl", dim = true },
    { token = "$u5h", rules = [
      { gt = 90, fg = "#db4b4b", bold = true },
      { gt = 75, fg = "#c07617" },
    ] },
    { token = "$u5hr", dim = true },
  ],
  [
    { token = "$u7dl", dim = true },
    { token = "$u7d", rules = [
      { gt = 90, fg = "#db4b4b", bold = true },
      { gt = 75, fg = "#c07617" },
    ] },
    { token = "$u7dr", dim = true },
  ],
]
pi = [
  ["state_icon", "workspace", "tab"],
  [{ token = "$model", bold = true }, { token = "$effort", dim = true }],
  ["$repo", { token = "$branch", dim = true }],
  [
    { token = "$ctxl", dim = true },
    { token = "$ctx", rules = [
      { gt = 90, fg = "#db4b4b", bold = true },
      { gt = 75, fg = "#c07617" },
    ] },
  ],
  ["$spend"],
  # The hit ratio shares the row with the read/write counts it qualifies. Its "h"
  # label is the tail of $cache rather than a token here, so that the pipe before
  # it comes from inside a value -- herdr joins these two with the middle dot,
  # giving "r · 11.8M | w · 197.8k | h · 98". Its thresholds are inverted against
  # ctx/u5h/u7d above: those are bad as they climb, this one is bad as it falls.
  [
    "$cache",
    { token = "$hit", rules = [
      { lt = 50, fg = "#db4b4b", bold = true },
      { lt = 75, fg = "#c07617" },
    ] },
  ],
]

[ui.toast]
delivery = "terminal"
