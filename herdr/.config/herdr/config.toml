# herdr server reload-config
onboarding = false

[theme]
name = "tokyo-night-day"
auto_switch = true

[keys]
next_tab = ["prefix+n", "ctrl+alt+]"]
goto = ["prefix+ctrl+w"]
cycle_pane_next = "prefix+ctrl+o"
split_vertical = "prefix+backslash"
next_agent = "alt+]"
previous_agent = "alt+["
focus_agent = "alt+1..9"
next_workspace = ["prefix+ctrl+n"]
previous_workspace = ["prefix+ctrl+p"]

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "cd ~/.dotfiles && pi --model glean"
description = "Pi with Glean"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "nvim -c Projects"
description = "Projects"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = "fzf-herdr-project"
description = "Fuzzy-find or clone projects"
width = "80%"
height = "80%"

[ui]
show_agent_labels_on_pane_borders = false

# One block per agent, fed by ~/.local/bin/herdr-agent-status. The $tokens are
# self-labelling because herdr adds no labels of its own, and a row disappears
# when none of its tokens has a value.
#
# One token per row: herdr joins the tokens within a row with a middle dot, so
# anything that should read as a single phrase ("opus-5 (medium)") is assembled
# in herdr-agent-status instead.
#
# The per-agent overrides omit the `agent` built-in because $model already names
# what is running, more precisely than the agent label does.
agent_panel_sort = "priority"
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  [{ token = "$model", bold = true }],
  ["$where"],
  ["$ctx"],
  ["$u5h"],
  ["$u7d"],
]
pi = [
  ["state_icon", "workspace", "tab"],
  [{ token = "$model", bold = true }],
  ["$where"],
  ["$ctx"],
  ["$spend"],
  ["$cache"],
]

[ui.toast]
delivery = "herdr"
