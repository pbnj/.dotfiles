# herdr server reload-config
onboarding = false

[theme]
name = "tokyo-night-day"
auto_switch = true

[keys]
next_tab = ["prefix+n", "ctrl+alt+]"]
goto = ["prefix+ctrl+w"]
cycle_pane_next = "prefix+ctrl+o"
split_vertical = "prefix+backslash"
next_agent = "alt+]"
previous_agent = "alt+["
focus_agent = "alt+1..9"
next_workspace = ["prefix+ctrl+n"]
previous_workspace = ["prefix+ctrl+p"]
# prefix+1..9 goes to workspaces, not tabs; tabs stay on prefix+n / prefix+p.
switch_workspace = "prefix+1..9"
switch_tab = ""
# Closest thing to tmux's prefix+l: jumps to the last focused pane, across
# workspaces and tabs. prefix+l itself is focus_pane_right.
last_pane = "prefix+tab"
# prefix+shift+w is a new workspace rooted at the komodohealth org dir (below);
# renaming a workspace is rare enough to live in the workspace picker instead.
rename_workspace = ""

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "cd ~/.dotfiles && pi --model glean"
description = "Pi with Glean"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "nvim -c Projects"
description = "Projects"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = "fzf-herdr-project"
description = "Fuzzy-find or clone projects"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+ctrl+c"
type = "popup"
command = "claude"
description = "Claude"
width = "80%"
height = "80%"

# prefix+shift+n keeps inheriting the current workspace's cwd; this is the
# escape hatch for starting somewhere unrelated to what is already open. `shell`
# runs detached, so nothing flashes a pane on the way past.
[[keys.command]]
key = "prefix+shift+w"
type = "shell"
command = "herdr workspace create --cwd \"$HOME/Projects/github.com/komodohealth\" --focus"
description = "New workspace in komodohealth"

[ui]
show_agent_labels_on_pane_borders = false

# A single-tab workspace has nothing to switch between, so the row is only
# chrome. It comes back the moment a second tab exists.
hide_tab_bar_when_single_tab = true

# The third row is the agent's pull request, fed by ~/.local/bin/herdr-agent-status
# from claude's status line and pi's agent-pane-status extension. A row
# disappears when none of its tokens has a value, so a pane on a branch with no
# PR costs no line.
#
# The tokens are Nerd Font glyphs, and the rules here match the exact glyph that
# script sends - "\uF00C" is the same nf-fa-check it writes as UTF-8 bytes - so
# a glyph changed in one place has to change in the other. Rules are ordered and
# the first match wins. `fg` is a literal hex and does not follow
# theme.auto_switch, so these are mid-tones that hold up on both themes: red
# needs action, orange is waiting, green is done.
#
# herdr joins the tokens in a row with a middle dot:
#
#   <PR glyph> #7 · draft · <CI glyph> 2 · <review glyph> · <comments glyph> · 3
#
# The number beside the CI glyph is how many jobs are still running (pending)
# or have failed (failing); it shares the glyph's token, so $prci is colored with
# `starts_with` rather than `equals`.
#
# The trailing pair is the count of unresolved review threads, orange from one
# and red past four; it travels as a bare number apart from its glyph because
# `gt` only compares values that parse completely as numbers, and both vanish at
# zero. $prstate is empty while the PR is open, and $prci, $prrev and the thread
# count are cleared once it is merged or closed.
agent_panel_sort = "priority"
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
  [
    { token = "$pr", bold = true },
    { token = "$prstate", dim = true, rules = [
      { equals = "merged", fg = "#9d7cd8", dim = false },
      { equals = "closed", fg = "#db4b4b", dim = false },
    ] },
    { token = "$prci", rules = [
      { starts_with = "\uF00D", fg = "#db4b4b", bold = true },
      { starts_with = "\uF017", fg = "#c07617" },
      { starts_with = "\uF00C", fg = "#41a35b" },
    ] },
    { token = "$prrev", rules = [
      { equals = "\uF044", fg = "#db4b4b", bold = true },
      { equals = "\uF06E", fg = "#c07617" },
      { equals = "\uF164", fg = "#41a35b" },
    ] },
    { token = "$prthl", dim = true },
    { token = "$prth", rules = [
      { gt = 4, fg = "#db4b4b", bold = true },
      { gt = 0, fg = "#c07617" },
    ] },
  ],
]

[ui.toast]
delivery = "herdr"
