# SENSIBLE

set-option -g automatic-rename on
set-option -g automatic-rename-format "#(~/.config/tmux/scripts/git-cwd.sh '#{pane_current_path}')"
set-option -g base-index 1
set-option -g default-command "${SHELL}"

# Load ~/.work.profile into the global environment (a dotenv for tmux): once at
# server start, and again before any pane that runs a program instead of a shell.
run-shell '~/.config/tmux/scripts/sync-env.sh'
set-option -g default-terminal 'tmux-256color'
set-option -g extended-keys-format csi-u # for pi
set-option -g focus-events on
set-option -g history-limit 20000
set-option -g mode-keys vi
set-option -g monitor-activity off
# Swallow bells (e.g. Claude's terminal_bell) instead of passing them on to the
# terminal. tmux still flags the window, so the status bar "!" and Alt+a work.
set-option -g bell-action none
set-option -g mouse on
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g set-clipboard on
set-option -g status on
set-option -g status-interval 1

# tmux 3.8: follow each client's reported light/dark appearance. Ghostty follows
# macOS with TokyoNight Day/Moon; unknown client appearances default to dark.
# Theme black/white are semantic background/foreground roles, even in light mode.
set-option -s theme detect

# TokyoNight Moon
set-option -s dark-theme-black '#222436'
set-option -s dark-theme-white '#c8d3f5'
set-option -s dark-theme-light-grey '#828bb8'
set-option -s dark-theme-dark-grey '#545c7e'
set-option -s dark-theme-green '#c3e88d'
set-option -s dark-theme-yellow '#ffc777'
set-option -s dark-theme-red '#ff757f'
set-option -s dark-theme-blue '#82aaff'
set-option -s dark-theme-cyan '#86e1fc'
set-option -s dark-theme-magenta '#c099ff'

# TokyoNight Day
set-option -s light-theme-black '#e1e2e7'
set-option -s light-theme-white '#3760bf'
set-option -s light-theme-light-grey '#6172b0'
set-option -s light-theme-dark-grey '#a1a6c5'
set-option -s light-theme-green '#587539'
set-option -s light-theme-yellow '#8c6c3e'
set-option -s light-theme-red '#f52a65'
set-option -s light-theme-blue '#2e7de9'
set-option -s light-theme-cyan '#007197'
set-option -s light-theme-magenta '#9854f1'

# Pending-chord indicator: names the active key table ("^B" for prefix, "ai"
# for the C-a agent table) and is blank in the root table. Fixed 4 columns so
# the window list never shifts when a chord is armed.
#
# The style sits OUTSIDE #{p4:} because #[...] sequences count as literal
# characters when padding. Note also that the argument of #{pN:} is resolved as
# a variable name unless it contains a nested #{...} - "#{p4:ab}" yields four
# spaces, not "ab  " - hence the nested conditional rather than a flat one.
set-option -g status-left '#("$HOME/.config/tmux/scripts/agent-status.py" #{q:socket_path})#[fg=themeblue,bold]#{p4:#{?#{==:#{client_key_table},root},,#{?#{==:#{client_key_table},prefix},^B,#{client_key_table}}}}#[default]'
set-option -g status-left-length 4
set-option -g status-position top
set-option -g status-right ""
set-option -g status-right-length 0
set-option -g status-style 'bg=themeblack,fg=themewhite'
# -ga appends: plain -g would clobber tmux's built-in defaults (xterm* clipboard,
# ccolour, cstyle, focus, title). hyperlinks enables OSC 8 passthrough.
set-option -ga terminal-features ',*:RGB:hyperlinks'
set-option -g visual-activity off
set-option -g wrap-search off
set-option -ga terminal-overrides ',*:enacs@:smacs@:rmacs@:acsc@'
# `all`, not `on`: `on` forwards passthrough only from panes in a visible window,
# which drops the desktop notifications Claude sends from background windows.
set-option -gq allow-passthrough all
# Current window: inverted onto adaptive blue; other windows are dimmed to gray.
set-option -gw window-status-style 'fg=themedarkgrey'
set-option -gw window-status-current-style 'fg=themeblack,bg=themeblue,bold'
# Bell alerts default to `reverse`, which fills the tab gray; keep the plain
# tab and let window-status-format draw a bell icon instead.
set-option -gw window-status-bell-style 'fg=themedarkgrey'
# Hide pane separators and title bars; tmux still reserves separator cells.
set-option -g pane-border-lines spaces
set-option -g pane-border-style 'fg=themeblack,bg=themeblack'
set-option -g pane-active-border-style 'fg=themeblack,bg=themeblack'
set-option -g pane-border-indicators off
set-option -g pane-border-status off
set-option -g popup-style 'bg=themeblack,fg=themewhite'
set-option -g popup-border-style 'fg=themeblue'
set-option -s escape-time 0
set-option -s extended-keys on

if-shell '[[ $(uname -s) == Darwin ]]' { set -s copy-command 'pbcopy' }

###############################################################################
# KEYBINDINGS
###############################################################################

## Create 'C-a' chain for ai keybinds
# refresh-client -S forces the status redraw: tmux flags one when the prefix
# flag toggles, but not reliably when switch-client -T enters a custom table.
bind-key C-a { switch-client -T ai ; refresh-client -S }
bind-key -T ai p { run-shell '~/.config/tmux/scripts/sync-env.sh' ; split-window -c '#{pane_current_path}' -- pi }
bind-key -T ai c { run-shell '~/.config/tmux/scripts/sync-env.sh' ; split-window -c '#{pane_current_path}' -- claude --dangerously-skip-permissions }
bind-key -T ai g { run-shell '~/.config/tmux/scripts/sync-env.sh' ; split-window -c '#{pane_current_path}' -- copilot --yolo }

## Quick scroll/copy mode entry
bind-key Space copy-mode

## productivity
bind-key C-] run-shell ${HOME}/.local/bin/tmux-scrollback
bind-key C-f display-popup -E -w 80% -h 80% -d '#{pane_current_path}' -- ${HOME}/.local/bin/fzf-tmux-project
bind-key C-w display-popup -E -w 80% -h 80% -- ${HOME}/.local/bin/fzf-tmux-window
bind-key C-/ new-window -c ${HOME}/Projects -- nvim -c 'lua Snacks.picker.grep({ title = "Grep (all projects)", dirs = { "~/Projects/" }, layout = { fullscreen = true } })'
bind-key C-s split-window -- ${HOME}/.local/bin/search

## Smooth scrolling with mouse wheel (already enabled with 'mouse on')
## Use Shift+PageUp/PageDown for history outside copy mode
bind-key -n S-PageUp copy-mode -u
bind-key -n S-PageDown copy-mode -u

## Copy/scroll mode navigation
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi i send-keys -X cancel
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

## Open URL under cursor (select word, pipe to open)
set -g word-separators " \t\n"
bind-key -T copy-mode-vi o send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "$HOME/.config/tmux/scripts/open-url.sh"

## Vi keys for history scrolling in copy mode
bind-key -T copy-mode-vi j send -X cursor-down
bind-key -T copy-mode-vi k send -X cursor-up
bind-key -T copy-mode-vi h send -X cursor-left
bind-key -T copy-mode-vi l send -X cursor-right
bind-key -T copy-mode-vi '/' command-prompt -p 'search forward:' 'send -X search-forward "%%%"'
bind-key -T copy-mode-vi '?' command-prompt -p 'search backward:' 'send -X search-backward "%%%"'
bind-key -T copy-mode-vi n send -X search-again
bind-key -T copy-mode-vi N send -X search-reverse
bind-key -T copy-mode-vi g send -X history-top
bind-key -T copy-mode-vi G send -X history-bottom
bind-key -T copy-mode-vi C-d send -X halfpage-down
bind-key -T copy-mode-vi C-u send -X halfpage-up
bind-key -T copy-mode-vi C-f send -X page-down
bind-key -T copy-mode-vi C-b send -X page-up

## Prompt navigation in copy mode
bind-key -T copy-mode-vi '[' send -X previous-prompt
bind-key -T copy-mode-vi ']' send -X next-prompt

## Command history navigation (edit mode)
bind-key -T edit-mode-vi Down send-keys -X history-down
bind-key -T edit-mode-vi Up send-keys -X history-up

## Quick access to prompt/history
bind-key Enter {
  copy-mode ;
  send-keys -X previous-prompt ;
  send-keys -X select-line ;
  send-keys -X next-prompt ;
}

## from: https://github.com/tmux-plugins/tmux-pain-control/blob/master/pain_control.tmux
### Window nav
bind-key '<' swap-window -t -1\; select-window -t -1
bind-key '>' swap-window -t +1\; select-window -t +1
bind-key C-n select-window -n
bind-key C-p select-window -p
bind-key -n M-] next-window
bind-key -n M-[ previous-window
### Alt+a jumps to the next window with an alert (e.g. a Claude bell)
bind-key -n M-a next-window -a
### Alt+1..9 jumps to window 1..9; `:=N` matches the index exactly
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9

## Spliting windows
bind-key - split-window -v -c '#{pane_current_path}'
bind-key '\' split-window -h -c '#{pane_current_path}'
bind-key '%' split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

## Panes nav
bind-key  C-h  select-pane  -L
bind-key  C-j  select-pane  -D
bind-key  C-k  select-pane  -U
bind-key  C-l  select-pane  -R
bind-key  H    join-pane    -h  -t  !
bind-key  J    join-pane    -v  -t  !

unbind C-o
bind-key C-o select-pane -t+

# The shared status-left job refreshes @agent_state once per status tick,
# across every pane/window: blocked > working > idle. Ordinary windows are blank.
set-option -g @agent_symbol '#{?#{==:#{@agent_state},blocked},!,#{?#{==:#{@agent_state},working},◐,○}}'
set-option -g @agent_color '#{?#{==:#{@agent_state},blocked},themered,#{?#{==:#{@agent_state},working},themeyellow,themelightgrey}}'
# Keep native flags beside the name, then a spaced agent badge and outer inset.
# A bell alert drops tmux's `!` flag for a bell icon (Nerd Font, bundled with Ghostty).
set-option -g window-status-format ' #I:#W#{s/!//:window_flags}#{?window_bell_flag, #[fg=themeblue]#[fg=themedarkgrey],}#{?@agent_state, #[fg=#{E:@agent_color}]#{E:@agent_symbol}#[fg=themedarkgrey],} '
# Keep the active badge in the tab's high-contrast foreground on its blue fill.
set-option -g window-status-current-format ' #I:#W#{window_flags}#{?@agent_state, #{E:@agent_symbol},} '
