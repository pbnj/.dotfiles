[tools]
betterleaks = "1.9.0"
hadolint = "2.15.1"
# luacheck has no mise backend, so luarocks (bundled with mise's lua) installs
# it into the lua install when mise installs lua.
lua = { version = "5.4.9", postinstall = "luarocks install luacheck 1.2.0" }
node = "26.13.0"
"npm:markdownlint-cli2" = "0.24.0"
"npm:oxfmt" = "0.75.0"
"npm:snyk" = "1.1308.3"
"npm:vscode-langservers-extracted" = "4.10.0"
"pipx:commitizen" = "4.19.3"
prek = "0.5.9"
ruff = "0.17.3"
shellcheck = "0.11.0"
stylua = "2.6.0"

# Accessibility is granted to the binary's code signature, so a rebuild revokes
# the grant: build only when the source changed, then re-grant once in System
# Settings > Privacy & Security > Accessibility.
[tasks."twingate:build"]
description = "Build ~/.local/bin/twingate_menu (sketchybar's Twingate login)"
sources = ["macos/twingate/twingate_menu.swift"]
outputs = ["{{env.HOME}}/.local/bin/twingate_menu"]
run = [
  'mkdir -p "$HOME/.local/bin"',
  'swiftc -O macos/twingate/twingate_menu.swift -o "$HOME/.local/bin/twingate_menu"',
]

[tasks."prek:install"]
description = "Install the prek git hooks (pre-commit and commit-msg)"
run = "prek install --hook-type pre-commit --hook-type commit-msg"

[tasks."prek:run"]
description = "Run the prek hooks on every file"
run = "prek run --all-files"
