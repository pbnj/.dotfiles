# Document types NvimGhostty.app claims, read by build.sh.
#
# Format:  <group> : <role> : <space-separated values>
#   name  human-readable CFBundleTypeName for the group
#   uti   UTIs macOS already defines
#   ext   every filename extension the group claims
#   dyn   the subset of ext with no system UTI, which therefore gets an imported
#         type declaration in the bundle; their dyn.* UTIs are per-machine
#         encodings of the extension and not stable registration targets
#
# Verify a UTI claim before adding it here:
#   printf x > /tmp/f.toml && mdls -raw -name kMDItemContentType /tmp/f.toml
# A dyn.* answer means the extension belongs in the dyn row too.
#
# Groups are disjoint, so each one is a meaningful unit to register on its own:
#   make macos-nvim-ghostty-register GROUPS="data config"
#
# Deliberately absent: .ts, which macOS maps to public.mpeg-2-transport-stream
# (a video type) rather than TypeScript. Claiming it would hijack video files.

data   : name : JSON Document
data   : uti  : public.json public.ndjson
data   : ext  : json jsonc json5 ndjson jsonl
data   : dyn  : jsonc json5 jsonl

text   : name : Plain Text
text   : uti  : public.plain-text com.apple.log public.comma-separated-values-text public.tab-separated-values-text
text   : ext  : txt text log csv tsv

docs   : name : Markup Document
docs   : uti  : net.daringfireball.markdown public.xml
docs   : ext  : md markdown xml

config : name : Configuration File
config : uti  : public.yaml
config : ext  : yaml yml toml ini conf env tfvars hcl
config : dyn  : toml ini conf env tfvars hcl

source : name : Source Code
source : uti  : public.python-script public.shell-script public.bash-script public.zsh-script com.netscape.javascript-source
source : ext  : py sh bash zsh js lua go rs sql nix zig
source : dyn  : lua go rs sql nix zig
